name: Publish prototype release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag
        required: true
        default: v0.1

permissions:
  contents: write

concurrency:
  group: prototype-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish tagged artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="$REQUESTED_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version=v0.1
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          git checkout --detach "refs/tags/$version"
          (cd downloads && sha256sum -c SHA256SUMS.txt)
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" downloads/UniFrame-Desktop-linux-x64.tar.gz downloads/UniFrame-prototype-windows-x64.zip downloads/SHA256SUMS.txt --clobber
          else
            gh release create "$version" --verify-tag --title "EVRKare / UniFrame $version" --notes-file "docs/releases/$version.md" --prerelease downloads/UniFrame-Desktop-linux-x64.tar.gz downloads/UniFrame-prototype-windows-x64.zip downloads/SHA256SUMS.txt
          fi
